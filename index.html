<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const themes=["default","coffee","mint","forest","office"];
        const savedColorTheme=localStorage.getItem("construction-management-color-theme");
        document.documentElement.dataset.appTheme=themes.includes(savedColorTheme) ? savedColorTheme : "default";
        const saved=localStorage.getItem("construction-management-theme");
        const dark=saved==="dark"||(saved!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark",dark);
        document.documentElement.style.colorScheme=dark?"dark":"light";
      } catch {}
    </script>
    <title>Construction Management</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
